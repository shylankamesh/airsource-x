name: Publish AirSource X demo

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "results/delhi_ito_2024_25/EXPERIMENT_RESULTS.md"
      - "results/delhi_ito_2024_25/forecast_metrics.csv"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare static site and study report
        run: |
          mkdir -p _site/results/delhi_ito_2024_25
          cp -R website/. _site/
          cp results/delhi_ito_2024_25/EXPERIMENT_RESULTS.md _site/results/delhi_ito_2024_25/
          cp results/delhi_ito_2024_25/forecast_metrics.csv _site/results/delhi_ito_2024_25/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
